name: Train Mochi real LLM

on:
  push:
    branches:
      - mochi-real-llm-training
    paths:
      - "mochi_training/source.tar.gz.b64.part-*"
      - ".github/workflows/train-mochi-real-llm.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mochi_training/source.tar.gz.b64.part-*"
      - ".github/workflows/train-mochi-real-llm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mochi-real-llm-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - name: Check out training branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify reviewed training source
        shell: bash
        run: |
          cat mochi_training/source.tar.gz.b64.part-* | base64 --decode > /tmp/mochi-training-source.tar.gz
          echo "12a01f5975f2063b3286281ee9cca697b3b67733fac5946f252f8cff84ae58ab  /tmp/mochi-training-source.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/mochi-training-source.tar.gz
          test -f mochi_training/train.py
          test -f mochi_training/verify.py
          test -f mochi_training/app.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mochi_training/requirements-app.txt

      - name: Cache pretrained Qwen base
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen2.5-0.5b-instruct-${{ runner.os }}-v1

      - name: Install CPU training dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install \
            transformers==4.48.3 \
            peft==0.14.0 \
            accelerate==1.3.0 \
            safetensors==0.5.2 \
            requests==2.32.3 \
            fastapi==0.115.8 \
            uvicorn==0.34.0

      - name: Run data and retrieval unit tests
        working-directory: mochi_training
        run: python -m unittest -v test_core.py

      - name: Fine-tune Qwen2.5 0.5B as Mochi on maxyaport.com
        run: >-
          python mochi_training/train.py
          --output-dir mochi-output
          --base-model Qwen/Qwen2.5-0.5B-Instruct
          --max-chunks 24
          --max-length 112
          --optimizer-steps 12
          --gradient-accumulation 2
          --learning-rate 0.0005
          --eval-examples 4

      - name: Reload adapter and verify generation
        run: python mochi_training/verify.py --bundle mochi-output

      - name: Package local HTML chat app
        run: >-
          python mochi_training/package_bundle.py
          --trained mochi-output
          --source mochi_training
          --output dist/Mochi-real-LLM.zip

      - name: Print auditable training evidence
        shell: bash
        run: |
          echo "--- training_metrics.json ---"
          cat mochi-output/training_metrics.json
          echo "--- verification.json ---"
          cat mochi-output/verification.json
          echo "--- package checksum ---"
          sha256sum dist/Mochi-real-LLM.zip

      - name: Upload trained Mochi package
        uses: actions/upload-artifact@v4
        with:
          name: Mochi-real-LLM
          path: dist/Mochi-real-LLM.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
