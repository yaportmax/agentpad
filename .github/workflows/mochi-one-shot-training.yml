name: Mochi one-shot real LLM training

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mochi-one-shot-training.yml"
      - ".github/mochi-training-trigger.txt"
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: mochi-real-llm-one-shot
  cancel-in-progress: false

env:
  TRAINING_BRANCH: mochi-real-llm-training
  TOKENIZERS_PARALLELISM: "false"
  HF_HUB_DISABLE_TELEMETRY: "1"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"

jobs:
  guard:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && github.event.issue.number == 1 && github.event.comment.body == '/train-mochi-real-llm')
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.status.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mochi-real-llm-training
      - id: status
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path("training-results/mochi-real-llm.json")
          status = "none"
          if path.exists():
              try:
                  status = str(json.loads(path.read_text(encoding="utf-8")).get("status") or "none")
              except Exception:
                  status = "invalid"
          print(f"existing_status={status}")
          print(f"should_run={'false' if status in {'running', 'success'} else 'true'}")
          PY

  train:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out reviewed training branch
        uses: actions/checkout@v4
        with:
          ref: mochi-real-llm-training

      - name: Record that training actually started
        shell: bash
        run: |
          mkdir -p training-results
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              "model": "Mochi",
              "status": "running",
              "base_model": "Qwen/Qwen2.5-0.5B-Instruct",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "started_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("training-results/mochi-real-llm.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training-results/mochi-real-llm.json
          git commit -m "chore: mark Mochi training started"
          git push origin "HEAD:${TRAINING_BRANCH}"

      - name: Reconstruct and verify reviewed source archive
        shell: bash
        run: |
          cat mochi_training/source.tar.gz.b64.part-* | base64 --decode > /tmp/mochi-training-source.tar.gz
          echo "12a01f5975f2063b3286281ee9cca697b3b67733fac5946f252f8cff84ae58ab  /tmp/mochi-training-source.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/mochi-training-source.tar.gz
          test -f mochi_training/train.py
          test -f mochi_training/verify.py
          test -f mochi_training/app.py

      - name: Use float32 for broad CPU compatibility
        shell: bash
        run: |
          sed -i 's/torch_dtype=torch.bfloat16/torch_dtype=torch.float32/g' mochi_training/train.py mochi_training/verify.py
          grep -q 'torch_dtype=torch.float32' mochi_training/train.py
          grep -q 'torch_dtype=torch.float32' mochi_training/verify.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mochi_training/requirements-app.txt

      - name: Cache pretrained Qwen base
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen2.5-0.5b-instruct-${{ runner.os }}-v1

      - name: Install CPU training dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install \
            transformers==4.48.3 \
            peft==0.14.0 \
            accelerate==1.3.0 \
            safetensors==0.5.2 \
            requests==2.32.3 \
            fastapi==0.115.8 \
            uvicorn==0.34.0

      - name: Run data and retrieval unit tests
        working-directory: mochi_training
        run: python -m unittest -v test_core.py

      - name: Fine-tune the real pretrained causal language model
        run: >-
          python mochi_training/train.py
          --output-dir mochi-output
          --base-model Qwen/Qwen2.5-0.5B-Instruct
          --max-chunks 24
          --max-length 112
          --optimizer-steps 12
          --gradient-accumulation 2
          --learning-rate 0.0005
          --eval-examples 4

      - name: Reload adapter and verify generation
        run: python mochi_training/verify.py --bundle mochi-output

      - name: Package local HTML chat app
        run: >-
          python mochi_training/package_bundle.py
          --trained mochi-output
          --source mochi_training
          --output dist/Mochi-real-LLM.zip

      - name: Print auditable evidence
        shell: bash
        run: |
          cat mochi-output/training_metrics.json
          cat mochi-output/verification.json
          sha256sum dist/Mochi-real-LLM.zip

      - name: Upload trained Mochi package
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mochi-real-LLM
          path: dist/Mochi-real-LLM.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record final result on the training branch
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          mkdir -p training-results
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              "model": "Mochi",
              "status": "success" if os.environ.get("JOB_STATUS") == "success" else "failure",
              "base_model": "Qwen/Qwen2.5-0.5B-Instruct",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "artifact_name": "Mochi-real-LLM",
              "artifact_id": int(os.environ["ARTIFACT_ID"]) if os.environ.get("ARTIFACT_ID") else None,
              "artifact_url": os.environ.get("ARTIFACT_URL") or None,
              "finished_at": datetime.now(timezone.utc).isoformat(),
          }
          metrics = Path("mochi-output/training_metrics.json")
          verification = Path("mochi-output/verification.json")
          package = Path("dist/Mochi-real-LLM.zip")
          if metrics.exists():
              payload["metrics"] = json.loads(metrics.read_text(encoding="utf-8"))
          if verification.exists():
              payload["verification"] = json.loads(verification.read_text(encoding="utf-8"))
          if package.exists():
              import hashlib
              payload["package_sha256"] = hashlib.sha256(package.read_bytes()).hexdigest()
              payload["package_bytes"] = package.stat().st_size
          Path("training-results/mochi-real-llm.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training-results/mochi-real-llm.json
          git commit -m "chore: record Mochi training result" || true
          git push origin "HEAD:${TRAINING_BRANCH}"
